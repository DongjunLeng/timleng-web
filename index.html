<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YOR1E — Photography &amp; Study Library</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg:      #f5f0e8;
      --ink:     #2a2016;
      --muted:   #6b5a3e;
      --faint:   #8a7254;
      --rule:    #c8b89a;
      --film:    sepia(18%) contrast(1.06) brightness(0.96) saturate(0.82);
      --film-lb: sepia(14%) contrast(1.08) brightness(0.95) saturate(0.80);
    }

    #curtain {
      position: fixed;
      inset: 0;
      z-index: 9999;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #curtain-left, #curtain-right {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      background: #1a1208;
      transition: transform 1.4s cubic-bezier(0.76, 0, 0.24, 1);
    }
    #curtain-left  { left: 0; }
    #curtain-right { right: 0; }
    #curtain-title {
      position: relative;
      z-index: 1;
      font-size: 4rem;
      font-weight: 400;
      letter-spacing: 0.3em;
      color: #c8b89a;
      font-family: 'Georgia', serif;
      transition: opacity 0.4s ease;
      user-select: none;
    }
    #curtain-sub {
  font-size: 0.75rem;
  letter-spacing: 0.2em;
  color: #7a6644;
  text-transform: uppercase;
  margin-top: 1.2rem;
  text-align: center;
}
    #curtain.open #curtain-left  { transform: translateX(-100%); }
    #curtain.open #curtain-right { transform: translateX(100%); }
    #curtain.open #curtain-title { opacity: 0; }
    #curtain[hidden] { display: none; }


    body {
      margin: 0;
      background: #eee6d7;
      color: var(--ink);
      font-family: Georgia, serif;
    }
    #curtain { width: 100%; border: 0; padding: 0; background: none; }
    #curtain:focus-visible, .entry:focus-visible { outline: 2px solid #a99573; outline-offset: -6px; }
    #curtain-title { font-size: clamp(2.5rem, 10vw, 4rem); }
    #curtain-sub { display: block; color: #a99573; }
    main { width: min(94rem, 100% - clamp(2rem, 8vw, 8rem)); margin-inline: auto; }
    header { display: flex; align-items: center; min-height: 4.5rem; border-bottom: 1px solid var(--rule); }
    h1 { margin: 0; font-size: 1.1rem; font-weight: 400; letter-spacing: .24em; }
    nav {
      display: grid;
      grid-template-columns: 1.65fr 1fr;
      gap: .75rem;
      padding-block: .75rem 2rem;
    }
    .entry {
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: end;
      min-height: clamp(25rem, calc(100svh - 8rem), 54rem);
      overflow: hidden;
      padding: clamp(1.25rem, 3vw, 3rem);
      color: #fff5e5;
      text-decoration: none;
    }
    .photo { background: #3d3026; }
    .photo img, .photo::after {
      position: absolute;
      z-index: -1;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .photo img { object-fit: cover; object-position: center; filter: var(--film); transition: transform .7s ease; }
    .photo::after { content: ""; background: linear-gradient(0deg, #160f0be8, transparent 70%); }
    .photo:hover img { transform: scale(1.045); }
    .study {
      background: #d7c6a6;
      color: #302318;
    }
    .study::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 1rem;
      border: 1px solid #80674770;
      background: repeating-linear-gradient(0deg, transparent 0 30px, #80674724 30px 31px);
      mask-image: linear-gradient(#000 45%, transparent 74%);
    }
    .course {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-8deg);
      color: #725837;
      font-size: clamp(2rem, 6vw, 7rem);
      font-style: italic;
      white-space: nowrap;
    }
    .entry-text { width: 100%; }
    h2 { margin: 0; font-size: clamp(2rem, 5vw, 5.75rem); font-weight: 400; line-height: .98; letter-spacing: -.055em; }
    .caption { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 1rem; }
    p { margin: 0; font-size: clamp(.8rem, 1.2vw, 1rem); line-height: 1.45; }
    .arrow {
      display: grid;
      flex: none;
      place-items: center;
      width: 2.6rem;
      aspect-ratio: 1;
      border: 1px solid currentColor;
      border-radius: 50%;
      transition: transform .2s ease;
    }
    .entry:hover .arrow, .entry:focus-visible .arrow { transform: translateX(.22rem); }
    @media (max-width: 700px) {
      header { min-height: 3.5rem; }
      nav { grid-template-columns: 1fr; }
      .entry { min-height: 23rem; }
      h2 { font-size: clamp(2.5rem, 9vw, 4rem); }
      .course { font-size: clamp(3rem, 13vw, 6rem); }
    }
    @media (prefers-reduced-motion: reduce) {
      #curtain-left, #curtain-right, #curtain-title, .photo img, .arrow { transition: none; }
    }
  </style>
</head>
<body>
  <button id="curtain" type="button" hidden>
    <span id="curtain-left" aria-hidden="true"></span>
    <span id="curtain-right" aria-hidden="true"></span>
    <span id="curtain-title">Yor1e<span id="curtain-sub">Click to begin</span></span>
  </button>
  <main>
    <header><h1>YOR1E</h1></header>
    <nav aria-label="Explore YOR1E">
      <a class="entry photo" href="./photography.html">
        <img src="https://pub-cdc43f8df55746749cd865266c7b86cc.r2.dev/4820A9AC-7B61-4BD6-B14E-FEF7DDBFBBB0_1_102_o.jpeg" alt="">
        <div class="entry-text">
          <h2>Photography</h2>
          <div class="caption">
            <p>Portrait, landscape, automotive and street</p>
            <span class="arrow" aria-hidden="true">→</span>
          </div>
        </div>
      </a>
      <a class="entry study" href="https://study.yor1e.com/">
        <span class="course" aria-hidden="true">MAT386</span>
        <div class="entry-text">
          <h2>Study Library</h2>
          <div class="caption">
            <p>only chinese version for now</p>
            <span class="arrow" aria-hidden="true">↗</span>
          </div>
        </div>
      </a>
    </nav>
  </main>
  <script>
    const curtain = document.getElementById('curtain');
    const main = document.querySelector('main');
    const firstEntry = main.querySelector('.entry');

    if (!sessionStorage.getItem('yor1e-entered')) {
      curtain.hidden = false;
      main.inert = true;
      curtain.focus({ preventScroll: true });
    }

    curtain.addEventListener('click', () => {
      sessionStorage.setItem('yor1e-entered', '1');
      curtain.classList.add('open');
      const delay = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 1400;
      setTimeout(() => {
        curtain.hidden = true;
        main.inert = false;
        firstEntry.focus({ preventScroll: true });
      }, delay);
    }, { once: true });
  </script>
</body>
</html>
